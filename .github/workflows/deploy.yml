name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Generate CV PDF (only when no assets/pdf/cv.pdf is committed)
        run: |
          if [ -f assets/pdf/cv.pdf ]; then echo "Using the uploaded assets/pdf/cv.pdf"; else
            pip3 install -q reportlab pyyaml && python3 bin/build_cv_pdf.py assets/pdf/cv.pdf; fi
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
